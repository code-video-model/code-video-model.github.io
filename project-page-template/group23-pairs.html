<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group23 · Paired Results</title>
  <link rel="stylesheet" href="static/group23-pairs/viewer.css?v=1">
  <link rel="stylesheet" href="static/css/group23-pairs.css?v=1">
</head>
<body class="group23-page" data-paired-results="true"
      data-manifest="static/group23-pairs/manifest.json" data-result-count="144">
  <main>
    <header>
      <nav><a href="./">Project Page</a><a href="gallery.html">Gallery</a><a href="paired-camera.html">New Camera Pairs · 20 Videos</a></nav>
      <h1>Group23 · Paired Results</h1>
      <p id="result-summary">Loading paired results…</p>
      <p id="settings" class="muted"></p>
      <p class="muted">A = Anchor · B = Variant. Each row compares the same input version and prompt scheme. Sync controls affect this pair only.</p>
    </header>
    <div class="filters" aria-label="Pair filters">
      <label hidden>Batch<select id="batch" disabled></select></label>
      <label>Section<select id="section" disabled></select></label>
      <label>Input version<select id="version" disabled></select></label>
      <label>Prompt scheme<select id="group" disabled></select></label>
      <label>Jump to case / pair<select id="case" disabled></select></label>
    </div>
    <p id="status" role="status" aria-live="polite">Loading results…</p>
    <section id="section-view" hidden>
      <h2 id="section-title"></h2>
      <p id="batch-description"></p>
      <p id="result-count" class="muted"></p>
      <div id="case-list"></div>
    </section>
  </main>
  <script type="module" src="static/group23-pairs/viewer.js?v=1"></script>
</body>
</html>
