<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Three.js · 新运镜配对展示</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="static/paired-camera/viewer.css?v=1">
</head>
<body>
  <header>
    <nav><a href="group23-pairs.html?batch=group23&amp;section=Scene+%2F+World+Editing">原 Scene / World Editing 页面</a><a href="static/paired-camera/manifest.json" download>下载展示清单</a></nav>
    <p class="eyebrow">THREE.JS / CAMERA VARIATIONS</p>
    <h1>同一场景，两套新运镜</h1>
    <p id="summary">正在加载…</p>
    <p class="note">左右为同轨迹的 Anchor / Variant。每组原场景有两套新运镜；仅展示已交付版本。12 个人形机器人／机器狗视频已暂停，不在此页。</p>
  </header>
  <div class="toolbar">
    <label>版本<select id="version"><option value="">全部版本</option></select></label>
    <label>运镜<select id="take"><option value="">两套运镜</option><option value="1">运镜 1</option><option value="2">运镜 2</option></select></label>
    <label class="search">查找场景 / Case<input id="search" type="search" placeholder="例如 v13、590 / 670、走廊"></label>
    <label>播放速度<select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
    <button id="clear" type="button">清除筛选</button>
  </div>
  <main>
    <p id="status" role="status" aria-live="polite">正在加载视频清单…</p>
    <div id="root"></div>
    <p id="empty" hidden>没有匹配结果，请修改筛选条件。</p>
  </main>
  <template id="pair-template">
    <article>
      <div class="heading"><h3></h3><span class="badge">已交付</span></div>
      <p class="meta"></p>
      <div class="panels"></div>
      <div class="controls">
        <button type="button" data-action="play">同步播放</button>
        <button type="button" data-action="reset">重置</button>
        <input class="seek" type="range" min="0" value="0" step="0.0416666666666667" aria-label="配对视频进度">
        <output class="time">0.00 / 5.17 s</output>
      </div>
      <p class="error" role="alert" hidden></p>
    </article>
  </template>
  <template id="panel-template">
    <figure>
      <figcaption></figcaption>
      <video preload="none" playsinline muted></video>
      <div class="video-links"><button type="button" class="fullscreen">全屏</button><a class="download">下载 MP4</a></div>
    </figure>
  </template>
  <script type="module" src="static/paired-camera/viewer.js?v=1"></script>
</body>
</html>
